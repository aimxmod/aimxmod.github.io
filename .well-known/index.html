<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#070b14">

    <title>Rank Booster</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at 50% 20%, #18294f 0%, transparent 35%),
                radial-gradient(circle at 20% 80%, #10233d 0%, transparent 30%),
                #070b14;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .circle {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            border: 1px solid rgba(80, 150, 255, 0.12);
            animation: rotate 15s linear infinite;
        }

        .circle:nth-child(1) {
            top: -120px;
            left: -120px;
        }

        .circle:nth-child(2) {
            bottom: -150px;
            right: -100px;
            width: 400px;
            height: 400px;
            animation-duration: 20s;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .container {
            width: calc(100% - 40px);
            max-width: 420px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

            width: 92px;
            height: 92px;
            margin: 0 auto 25px;
            border-radius: 26px;
            display: flex;
            align-items: center;
